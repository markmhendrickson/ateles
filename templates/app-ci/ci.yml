# App CI template: the per-PR budget is 15 minutes end to end.
# Copy to .github/workflows/ci.yml and fill in the commented slots.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the superseded run. A push to main gets a
# group of its own (its sha), so a later push can neither cancel it nor replace
# it as a pending run: every main commit gets a complete CI result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# SUPPLY CHAIN: the `uses:` lines below are pinned to movable tags for
# readability. In a real repo pin every third-party action to a full commit SHA
# (keep the tag in a trailing comment) and let a bot bump them; see README.
#
# Least privilege by default. Grant more per job only where a step needs it.
permissions:
  contents: read

jobs:
  # Cheap checks first, so a typo fails in minutes instead of after a long
  # test run.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # no step here pushes or fetches with git

      # --- Python slot -----------------------------------------------------
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"
      #     cache: pip
      # - run: pip install -r requirements-dev.txt
      # - run: ruff check .
      # - run: ruff format --check .
      # - run: mypy .

      # --- Node slot -------------------------------------------------------
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 22
      #     cache: npm
      # - run: npm ci
      # - run: npm run lint
      # - run: npm run format:check
      # - run: npm run typecheck

      # --- Hygiene (any stack) ---------------------------------------------
      # Secret scan, generated-file freshness, lockfile consistency, and
      # similar repo-specific checks belong here.
      # FILL THIS SLOT. It fails on purpose so an unfilled copy of this template
      # cannot report green. Delete the step once a real check is in place.
      - name: Unfilled slot (fails until replaced)
        run: |
          echo "::error::ci.yml 'fast' job has no checks yet: add lint, format, typecheck and hygiene steps above, then delete this step."
          exit 1

  test:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      # One failing shard fails the run early; the rest are cancelled.
      fail-fast: true
      matrix:
        # Split the suite into shards that each finish well inside the
        # timeout. Add shards rather than raising the timeout.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # --- Python slot (pytest-split, pytest-xdist, or per-directory) ------
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"
      #     cache: pip
      # - run: pip install -r requirements-dev.txt
      # - run: pytest --splits 3 --group ${{ matrix.shard }} -m "not slow"

      # --- Node slot (vitest/jest shard flags) -----------------------------
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 22
      #     cache: npm
      # - run: npm ci
      # - run: npx vitest run --shard=${{ matrix.shard }}/3

      # FILL THIS SLOT. It fails on purpose so an unfilled copy of this template
      # cannot report green. Delete the step once a real test command is in place.
      - name: Unfilled slot (fails until replaced)
        run: |
          echo "::error::ci.yml 'test' job has no test command yet (shard ${{ matrix.shard }} of 3): add it above, then delete this step."
          exit 1

  # The ONE aggregate check that branch protection (or the repo's approval
  # tool) requires. It passes only when every job it needs reports exactly
  # `success` (a positive check: a failed, cancelled, skipped, or any future
  # unknown result all fail it), so jobs can be added, renamed, or split without
  # touching protection.
  #
  # NAME: the job id and name below are whatever the repo's protection or
  # approval tooling ALREADY requires. A repo that already requires a check
  # called, say, `unit` keeps that exact job name; adopting the template must
  # not force a rename to `ci-summary`. The WORKFLOW name matters only if some
  # tooling keys on it (an approval tool that looks up checks by workflow);
  # otherwise leave it. Use `ci-summary` only in a repo with no existing name.
  ci-summary:
    if: always()
    needs: [fast, test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail unless every needed job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS_JSON"
          if ! printf '%s' "$NEEDS_JSON" | jq -e 'length > 0 and all(.[]; .result == "success")' >/dev/null; then
            echo "::error::One or more required jobs did not succeed."
            exit 1
          fi
