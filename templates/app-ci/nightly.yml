# Heavy suites that would push per-PR CI past its 15-minute budget run here
# instead: performance audits, native or integration suites, evals.
# Copy to .github/workflows/nightly.yml.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    # A release candidate runs the full set before it can be promoted.
    tags: ["rc-*"]
    branches: ["release/*"]

# Never cancel a scheduled or release-candidate run midway. The sha in the group
# keeps two different commits on one ref from replacing each other as a pending
# run; the same commit queued twice just runs in turn.
concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [performance, native-store, evals]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # no step here pushes or fetches with git

      # Install dependencies as in ci.yml (with caching), then run the suite.
      # --- Python slot -----------------------------------------------------
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"
      #     cache: pip
      # - run: pip install -r requirements-dev.txt
      # - run: pytest -m "${{ matrix.suite }}"

      # --- Node slot -------------------------------------------------------
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 22
      #     cache: npm
      # - run: npm ci
      # - run: npm run test:${{ matrix.suite }}

      # FILL THIS SLOT. It fails on purpose so an unfilled copy of this template
      # cannot report green. Delete the step once a real suite command is in place.
      - name: Unfilled slot (fails until replaced)
        run: |
          echo "::error::nightly.yml suite ${{ matrix.suite }} has no command yet: add it above, then delete this step."
          exit 1

  nightly-summary:
    if: always()
    needs: [heavy]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail unless every needed job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS_JSON"
          if ! printf '%s' "$NEEDS_JSON" | jq -e 'length > 0 and all(.[]; .result == "success")' >/dev/null; then
            echo "::error::One or more required jobs did not succeed."
            exit 1
          fi
