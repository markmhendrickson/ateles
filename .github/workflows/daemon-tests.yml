name: daemon watcher tests

# Runs piculet + cyphorhinus daemon test suites in CI (ateles#225 / ateles#228
# and ateles#1029 review: sidecar Path evals must collect for both meeting
# watchers). Tyto remains on ateles-tests.yml; this workflow is scoped to the
# shared report_meeting_recording watchers.

on:
  pull_request:
    paths:
      - "execution/daemons/piculet/**"
      - "execution/daemons/cyphorhinus/**"
      - ".github/workflows/daemon-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Run piculet daemon tests
        run: uv run --extra dev python -m pytest execution/daemons/piculet -q
      - name: Run cyphorhinus daemon tests
        run: uv run --extra dev python -m pytest execution/daemons/cyphorhinus -q
