name: daemon tests

# Runs the daemon regression suites that live under execution/daemons/**.
# The ateles-package workflow (ateles-tests.yml) is path-scoped to ateles/**
# and never triggers on daemon code, so daemon regression tests were invisible
# to CI (QA gate finding on PRs #190/#198/#206, and the ateles#225 / ateles#228
# review finding that piculet's test_watch.py existed but never ran). This lane
# closes that gap for the Turdus and piculet daemons using only core deps
# (httpx is a core dependency; apprise is import-guarded in lib/notify, so no
# extra deps). The rest of execution/daemons/** still has a CI-coverage gap,
# tracked separately.

on:
  pull_request:
    paths:
      - "execution/daemons/turdus/**"
      - "execution/daemons/piculet/**"
      - "lib/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/daemon-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  turdus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Run Turdus daemon tests
        # Run from repo root so the tests' sys.path bootstrap (repo root +
        # daemon dir) resolves lib.daemon_runtime / lib.notify imports.
        run: uv run --extra dev python -m pytest execution/daemons/turdus/ -q

  piculet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Run piculet daemon tests
        run: uv run --extra dev python -m pytest execution/daemons/piculet -q
