name: Ateles changelog preparation

# Prepare a full-SHA-bound changelog artifact; neither trigger publishes a
# release or creates a tag. The calendar tag is an unpublished preview only.
# Actual publication requires separate explicit operator approval; this workflow
# does not introduce a publisher or treat workflow_dispatch as that approval.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ateles-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the commit log)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Compute unpublished candidate tag
        id: tag
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          TODAY="$(date -u +%Y.%m.%d)"
          TAG="$(python3 execution/daemons/phoenicurus-release/tag_utils.py compute-tag \
            --today "$TODAY" --existing-tags "$(git tag)")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          PREV="$(git describe --tags --abbrev=0 "$SOURCE_SHA" 2>/dev/null || true)"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "Preparing $TAG at $SOURCE_SHA (previous: ${PREV:-none}); no publication"

      - name: Check for changelog content
        id: check
        env:
          SOURCE_SHA: ${{ github.sha }}
          PREV: ${{ steps.tag.outputs.prev }}
        run: |
          set -euo pipefail
          if [ -n "$PREV" ]; then
            COUNT="$(git rev-list --no-merges --count "$PREV..$SOURCE_SHA")"
          else
            COUNT=0
          fi
          if python3 execution/daemons/phoenicurus-release/tag_utils.py has-releasable-commits \
            --count "$COUNT" --prev "$PREV"; then
            echo "count=1" >> "$GITHUB_OUTPUT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "No non-merge changes; skipping notes and artifact"
          fi

      - name: Build unpublished changelog
        id: notes
        if: steps.check.outputs.count != '0'
        env:
          SOURCE_SHA: ${{ github.sha }}
          TAG: ${{ steps.tag.outputs.tag }}
          PREV: ${{ steps.tag.outputs.prev }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ateles-release-notes"
          {
            echo "# Ateles changelog preparation"
            echo
            echo "Source commit: $SOURCE_SHA"
            echo "Candidate tag: $TAG (not a published release)"
            echo
            echo "## Changes"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty=format:'- %s (%h)' "$PREV..$SOURCE_SHA"
              echo
              echo
              echo "**Full diff:** $REPOSITORY_URL/compare/$PREV...$SOURCE_SHA"
            else
              echo "Initial changelog preparation."
              git log --no-merges --pretty=format:'- %s (%h)' "$SOURCE_SHA"
              echo
            fi
          } > "$RUNNER_TEMP/ateles-release-notes/notes.md"
          cat "$RUNNER_TEMP/ateles-release-notes/notes.md"

      - name: Upload changelog preparation
        if: steps.check.outputs.count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ateles-notes-${{ github.sha }}
          path: ${{ runner.temp }}/ateles-release-notes/notes.md
          if-no-files-found: error
