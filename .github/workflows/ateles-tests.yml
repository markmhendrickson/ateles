name: ateles package tests

# Enforces the W0/W1+ package test suite plus the daemon test surface on every
# PR that touches either — the regression lane the QA gate asked for
# (ateles#206: the daemon path filter was missing entirely, so daemon
# regression tests never ran in CI).

on:
  pull_request:
    paths:
      - "ateles/**"
      - "execution/daemons/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ateles-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Run ateles package tests
        run: uv run --extra dev python -m pytest ateles/ -q
      - name: Run daemon tests
        run: uv run --extra dev python -m pytest execution/daemons/ -q
