name: ateles package tests

# Enforces the W0/W1+ package test suite plus the Claude Code hook tests, the
# phoenicurus-release daemon's regression tests, the shared approval lib tests,
# and the ateles MCP server tests on every PR that touches any of them — the
# regression lane the QA gate asked for. The daemon/lib paths are included so
# changes there actually get their tests run in CI, rather than silently
# skipping the lane.

on:
  pull_request:
    paths:
      - "ateles/**"
      - "apps/task-dashboard/**"
      - ".claude/hooks/**"
      - "execution/daemons/apis/**"
      - "execution/daemons/phoenicurus-release/**"
      - "execution/daemons/monedula/**"
      - "execution/daemons/anthus/**"
      - "execution/mcp/**"
      - "lib/daemon_runtime/**"
      - "lib/approval/**"
      - "execution/scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ateles-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Run ateles package tests
        run: uv run --extra dev python -m pytest ateles/ .claude/hooks/ -q
      # Swarm daemon tests (qa #254 finding): test_swarm_dispatch.py and the
      # rest of the Apis daemon suite never ran in CI — the lane above is scoped
      # to ateles/**, so a daemon regression (e.g. a dangling call from a stale
      # branch) shipped uncaught. Run them as their own step so a daemon-dep
      # failure is attributable, and so the path trigger above actually gates
      # execution/daemons/apis/** changes.
      - name: Run swarm daemon (apis) tests
        run: uv run --extra dev python -m pytest execution/daemons/apis/ -q
      - name: Run phoenicurus-release daemon tests
        run: uv run --extra dev python -m pytest execution/daemons/phoenicurus-release/ -q
      - name: Run monedula daemon tests
        run: uv run --extra dev python -m pytest execution/daemons/monedula/ -q
      # ateles#584 (qa lens, PR #596 round 1): the anthus orchestrator suite
      # (test_participation_state.py, test_dispatch_wiring.py,
      # test_orchestrator.py) was committed but collected by no lane. Its own
      # step, for the same attributability reason as the apis step above — not
      # because directories cannot share an invocation. Checked: a combined
      # `pytest execution/daemons/` collects and passes, and no two daemons
      # ship a same-named top-level module today.
      - name: Run anthus daemon tests
        run: uv run --extra dev python -m pytest execution/daemons/anthus/ -q
      - name: Run shared approval lib tests
        run: uv run --extra dev python -m pytest lib/approval/ -q
      # ateles#524 (qa lens, PR #527 round 2): execution/scripts/ has its own
      # test_*.py files (SOPS token fallback, Loxia review, agent-doc render,
      # transcription) but no lane ran them — this closes that gap.
      - name: Run execution/scripts tests
        run: uv run --extra dev python -m pytest execution/scripts/ -q

  mcp-server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install MCP server deps
        run: |
          uv venv .mcp-venv
          # mcp 2.0 renamed Tool.inputSchema → input_schema and removed Server.list_tools;
          # pin <2 until execution/mcp/ateles is migrated.
          VIRTUAL_ENV=.mcp-venv uv pip install "mcp>=1.1.0,<2" httpx
      - name: Run ateles MCP server tests
        run: .mcp-venv/bin/python execution/mcp/ateles/test_server.py
      - name: Run ateles MCP server smoke tests
        run: .mcp-venv/bin/python execution/mcp/ateles/test_server_smoke.py

  # ateles#695 (qa lens): task-dashboard vitest suite (taskState / taskPosition /
  # resolveTaskWorkflow). Path-triggered so dashboard-only PRs still get a CI
  # eval lane rather than relying on prose verification alone.
  task-dashboard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/task-dashboard/package-lock.json
      - name: Install task-dashboard deps
        working-directory: apps/task-dashboard
        run: npm ci
      - name: Run task-dashboard vitest
        working-directory: apps/task-dashboard
        run: npm test
