name: ateles package tests

# Enforces the W0/W1+ package test suite plus the Claude Code hook tests on
# every PR that touches either — the regression lane the QA gate asked for.

on:
  pull_request:
    paths:
      - "ateles/**"
      - ".claude/hooks/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ateles-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Run ateles package tests
        run: uv run --extra dev python -m pytest ateles/ .claude/hooks/ -q
