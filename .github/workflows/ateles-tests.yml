name: ateles package tests

# Enforces the W0/W1+ package test suite plus the Claude Code hook tests, the
# phoenicurus-release daemon's regression tests, the shared approval lib tests,
# and the ateles MCP server tests on every PR that touches any of them — the
# regression lane the QA gate asked for. The daemon/lib paths are included so
# changes there actually get their tests run in CI, rather than silently
# skipping the lane.

on:
  pull_request:
    paths:
      - "ateles/**"
      - ".claude/hooks/**"
      - "execution/daemons/apis/**"
      - "execution/daemons/phoenicurus-release/**"
      - "execution/daemons/monedula/**"
      - "execution/daemons/anthus/**"
      # ateles#866 (qa lens): test_tyto_routing.py was committed but no lane
      # collected it — the same unbound-suite defect as #524/#584. The daemon's
      # routing decision (mono -> local Whisper, multi-channel -> ElevenLabs)
      # had zero CI coverage.
      - "execution/daemons/tyto/**"
      - "execution/mcp/**"
      - "lib/daemon_runtime/**"
      - "lib/approval/**"
      - "lib/audio_fixture_support.py"
      - "lib/test_audio_fixture_support.py"
      - "lib/transcript_clarity.py"
      - "lib/test_transcript_clarity.py"
      - "execution/scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/linters/check_agent_roster.py"
      - "CLAUDE.md"
      - "scripts/linters/test_claude_verification_discipline.py"
      - "scripts/linters/test_*.py"
      - "docs/agents/**"
      - ".github/workflows/ateles-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # ateles#866: this lane CLAIMS to cover transcription-engine routing, so
      # a missing ffmpeg must turn it RED, not silently skip the tests that
      # carry the claim. See lib/audio_fixture_support.py for the rule.
      ATELES_REQUIRE_AUDIO_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      # ateles#866 (qa lens, BLOCKING #2): the transcription-routing tests
      # generate synthetic multi-channel fixtures with ffmpeg, and the
      # production channel counters end in ffprobe (tyto's is ffprobe-ONLY).
      # Without it on the runner every routing test SKIPPED and the lane still
      # went green — run 34240779554 read "413 passed, 13 skipped".
      #
      # Installing ffmpeg is necessary but is NOT by itself the control: if a
      # later edit drops this step, the tests return to passing-by-skipping and
      # nothing fails. ATELES_REQUIRE_AUDIO_FIXTURES below is what binds it —
      # with the flag set, a missing ffmpeg is a hard failure rather than a
      # skip (lib/audio_fixture_support.py). That is the thing that fails.
      - name: Install ffmpeg (audio-routing fixtures + ffprobe channel counts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      # ateles#320: retired agent names in runtime routing code. This linter
      # lives in scripts/lint.sh, which NO workflow invokes — so it never ran in
      # CI. Wired here as a blocking step because the failure it catches is
      # silent: `DEFAULT_OWNER = "gryllus"` filed 107 review findings to an
      # agent that does not exist, for seven weeks, with every test green.
      - name: Check agent roster (no retired agent names)
        run: python3 scripts/linters/check_agent_roster.py

      - name: Run ateles package tests
        run: uv run --extra dev python -m pytest ateles/ .claude/hooks/ -q
      # Swarm daemon tests (qa #254 finding): test_swarm_dispatch.py and the
      # rest of the Apis daemon suite never ran in CI — the lane above is scoped
      # to ateles/**, so a daemon regression (e.g. a dangling call from a stale
      # branch) shipped uncaught. Run them as their own step so a daemon-dep
      # failure is attributable, and so the path trigger above actually gates
      # execution/daemons/apis/** changes.
      - name: Run swarm daemon (apis) tests
        run: uv run --extra dev python -m pytest execution/daemons/apis/ -q
      - name: Run phoenicurus-release daemon tests
        run: uv run --extra dev python -m pytest execution/daemons/phoenicurus-release/ -q
      - name: Run monedula daemon tests
        run: uv run --extra dev python -m pytest execution/daemons/monedula/ -q
      # ateles#584 (qa lens, PR #596 round 1): the anthus orchestrator suite
      # (test_participation_state.py, test_dispatch_wiring.py,
      # test_orchestrator.py) was committed but collected by no lane. Its own
      # step, for the same attributability reason as the apis step above — not
      # because directories cannot share an invocation. Checked: a combined
      # `pytest execution/daemons/` collects and passes, and no two daemons
      # ship a same-named top-level module today.
      - name: Run anthus daemon tests
        run: uv run --extra dev python -m pytest execution/daemons/anthus/ -q
      # ateles#866 (qa lens, BLOCKING #1): test_tyto_routing.py was collected by
      # no lane. Its own step, matching the attributability convention of the
      # apis/anthus steps above, and paired with the path trigger that makes a
      # change under execution/daemons/tyto/** actually run it.
      - name: Run tyto daemon (transcription routing) tests
        run: uv run --extra dev python -m pytest execution/daemons/tyto/ -q
      - name: Run shared approval lib tests
        run: uv run --extra dev python -m pytest lib/approval/ -q
      - name: Run transcript clarity lib tests
        run: uv run --extra dev python -m pytest lib/test_transcript_clarity.py -q
      # The guard that turns a missing ffmpeg into a failure needs its own
      # coverage, or it is one more mechanism nothing checks. These tests assert
      # the fail branch is REACHABLE — reverting require_ffmpeg() to an
      # unconditional skip turns this step red.
      - name: Run audio-fixture guard tests
        run: uv run --extra dev python -m pytest lib/test_audio_fixture_support.py -q
      # ateles#524 (qa lens, PR #527 round 2): execution/scripts/ has its own
      # test_*.py files (SOPS token fallback, Loxia review, agent-doc render,
      # transcription) but no lane ran them — this closes that gap.
      - name: Run execution/scripts tests
        run: uv run --extra dev python -m pytest execution/scripts/ -q
      # ateles#727 / #731 (qa lens): CLAUDE.md Verification discipline effect
      # test was committed but collected by no lane — same defect class as
      # roster-in-lint.sh-only, anthus (#584/#596), execution/scripts (#524/#527).
      - name: Run CLAUDE.md verification-discipline effect tests
        run: uv run --extra dev python -m pytest scripts/linters/test_claude_verification_discipline.py -q

  mcp-server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install MCP server deps
        run: |
          uv venv .mcp-venv
          # Install from the requirements file so CI and the server share one
          # source of truth for the pin. That file pins mcp<2: mcp 2.0 renamed
          # Tool.inputSchema → input_schema and removed Server.list_tools, so
          # the pin holds until execution/mcp/ateles is migrated.
          VIRTUAL_ENV=.mcp-venv uv pip install -r execution/mcp/ateles/requirements.txt
      - name: Run ateles MCP server tests
        run: .mcp-venv/bin/python execution/mcp/ateles/test_server.py
      - name: Run ateles MCP server smoke tests
        run: .mcp-venv/bin/python execution/mcp/ateles/test_server_smoke.py
