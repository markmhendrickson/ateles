name: ateles package tests

# Enforces the W0/W1+ package test suite plus the Claude Code hook tests and the
# phoenicurus-release daemon's regression tests on every PR that touches any of
# them — the regression lane the QA gate asked for. The phoenicurus path is
# included so daemon-only changes (like the plist repair in #242) actually get
# their tests run in CI, rather than silently skipping the lane.

on:
  pull_request:
    paths:
      - "ateles/**"
      - ".claude/hooks/**"
      - "execution/daemons/phoenicurus-release/**"
      - "execution/mcp/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ateles-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Run ateles package tests
        run: uv run --extra dev python -m pytest ateles/ .claude/hooks/ -q
      - name: Run phoenicurus-release daemon tests
        run: uv run --extra dev python -m pytest execution/daemons/phoenicurus-release/ -q

  mcp-server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install MCP server deps
        run: |
          uv venv .mcp-venv
          VIRTUAL_ENV=.mcp-venv uv pip install -r execution/mcp/ateles/requirements.txt
      - name: Run ateles MCP server tests
        run: .mcp-venv/bin/python execution/mcp/ateles/test_server.py
      - name: Run ateles MCP server smoke tests
        run: .mcp-venv/bin/python execution/mcp/ateles/test_server_smoke.py
