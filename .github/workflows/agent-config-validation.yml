name: Agent config validation

# Validation lane for the Neotoma-canonical agent_definition surface (ateles#255):
#   1. tool_allowlist grant grammar — the `bash:<command>` prefix is silently
#      dropped by Claude Code's --allowedTools parser; only Bash(<command>:*)
#      is honored. This lane fails the build the moment that prefix reappears,
#      PROVIDED NEOTOMA_BEARER_TOKEN is configured (see caveat below).
#   2. Generated agent-doc mirror freshness — docs/agents/*.md and
#      .claude/skills/*/SKILL.md are rendered FROM Neotoma agent_definition
#      entities (execution/scripts/render_agent_docs.py) and must never be
#      hand-edited or left stale, per the swarm's
#      regenerate_generated_files_before_opening_pr policy.
#
# Both checks read live Neotoma state, so this lane needs NEOTOMA_BEARER_TOKEN
# (provisioned as a repo secret 2026-09-01). Both treat a missing token or an
# unreachable Neotoma as a clean SKIP (exit 0) rather than a failure, so the
# lane goes red only for a real defect.
#
# TRIGGERS — why there is a schedule as well as a PR lane (ateles#682):
# mirror drift ORIGINATES OUTSIDE THIS REPO. A session corrects an
# agent_definition in Neotoma and the checked-in mirror goes stale without a
# single file changing, so no pull_request ever fires and the path filter
# below never matches. That is exactly how ~24 agents drifted unnoticed. The
# PR lane catches a PR that edits mirrors by hand; only the schedule catches
# the far more common case of Neotoma moving on its own.

on:
  pull_request:
    paths:
      - "docs/agents/**"
      - ".claude/skills/**"
      - "execution/scripts/render_agent_docs.py"
      - "scripts/linters/validate_tool_allowlist.py"
      - ".github/workflows/agent-config-validation.yml"
  schedule:
    # 07:15 UTC daily — surfaces drift introduced by Neotoma-side corrections,
    # which touch no files and therefore trigger no PR.
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: tool_allowlist + agent-doc-mirror freshness
    runs-on: ubuntu-latest
    env:
      NEOTOMA_BEARER_TOKEN: ${{ secrets.NEOTOMA_BEARER_TOKEN }}
      NEOTOMA_BASE_URL: ${{ vars.NEOTOMA_BASE_URL || 'https://neotoma.markmhendrickson.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # NOTE: non-blocking for now. NEOTOMA_BEARER_TOKEN is not yet provisioned
      # as a repo secret (same pre-existing gap loxia-pr-review.yml and
      # lanius-stale-issues.yml already carry), so this step cannot yet reach
      # live Neotoma in CI. Per arch review on ateles#255: land the lint
      # informational first, promote to a hard gate once the secret exists
      # and a 9/9-green run confirms it. Flip to blocking (remove
      # `continue-on-error`) once NEOTOMA_BEARER_TOKEN is added to repo
      # secrets.
      - name: "Validate tool_allowlist grant grammar (no bash: prefix)"
        continue-on-error: true
        run: python3 scripts/linters/validate_tool_allowlist.py

      # BLOCKING as of ateles#682. The two preconditions the ateles#255
      # rollout named are now met: NEOTOMA_BEARER_TOKEN was provisioned as a
      # repo secret on 2026-09-01, and the full mirror regen in this PR put
      # docs/agents/ and .claude/skills/ back in sync with Neotoma (81 files,
      # 40 agents, `--check` clean).
      #
      # Why this had to become blocking rather than stay informational: the
      # mirrors are RENDER TARGETS of agent_definition.prompt_markdown, so any
      # session correcting an entity leaves the repo stale until someone
      # re-renders — and nothing enforced that. The drift this PR clears had
      # accumulated across 24 agents precisely because the only check was
      # advisory. An informational check reports the symptom forever; a gate
      # keeps the two trees in sync.
      #
      # `--skip-without-token` keeps the gate honest: a missing token or a
      # Neotoma outage exits 0 with a SKIP notice rather than failing, so the
      # lane goes red for actual mirror drift and nothing else. A gate that
      # cannot tell drift from an outage is one that gets disabled.
      #
      # When this fails: correct the agent_definition entity in Neotoma (never
      # edit the generated file), then run
      # `python3 execution/scripts/render_agent_docs.py` and commit the output.
      - name: Validate agent-doc mirrors are in sync with Neotoma
        run: python3 execution/scripts/render_agent_docs.py --check --skip-without-token
