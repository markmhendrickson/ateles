name: Loxia — External PR Review

# Loxia genus: crossbills. T4 invocable agent — reviews incoming PRs on the
# ateles mirror files and posts a structured review comment.
#
# Inference uses the shared subscription router; GitHub publication stays here.
#
# Canary gate (2026-09-26): bootstrap mode (agent_policy ent_d0f1a840e549b3b299f62397)
# runs software work through the operator/lens review path, not the swarm
# panel — so Loxia re-reviewing every push duplicated that work and burned
# the same Claude subscription quota bootstrap needed. Loxia now runs only
# for the `swarm-canary` lane: a PR carrying the canary label, or whose
# linked parent issue carries it. The `gate` job below computes that using
# the SAME matching rules Apis/Anthus use (`lib/daemon_runtime/label_gate.py`,
# ATELES_SWARM_REQUIRE_LABEL) so this workflow cannot drift into a different
# notion of "labelled". `main`'s only required status check today is
# "gitleaks (secrets + PII)" (verified via `gh api
# repos/<repo>/branches/main` — Loxia is NOT in required_status_checks), so a
# job-level `if:` skip is sufficient here: it does not need a fake
# always-green shadow job to keep a required check satisfied. If Loxia is
# ever added to required checks, revisit this — GitHub treats a job skipped
# by `if:` as passing for required-check purposes, but confirm that still
# holds before relying on it.
#
# Triggers:
#   - pull_request (opened, synchronize, reopened, labeled) on any branch
#     targeting main — `labeled` lets the canary label added AFTER a PR was
#     opened start review for it. The gate below evaluates CURRENT label
#     state (PR + parent issue), not the specific label that was just added,
#     so an unrelated label add on a non-canary PR still correctly denies —
#     unlike github_gateway.py's own `labeled` handling (see its
#     _labeled_event_admitted history, ateles#1269), which had to special-case
#     the triggering label because it fires agent work directly from the
#     event. This gate only ever flips a boolean read from current state, so
#     a spurious extra `gate` job run on an unrelated label is a cheap no-op,
#     not a duplicate review.
#   - workflow_dispatch for manual invocations (bypasses the gate — an
#     explicit operator/dispatch invocation is its own authorization).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
      dry_run:
        description: Dry run (print review without posting)
        required: false
        default: false
        type: choice
        options:
          - false
          - true

jobs:
  gate:
    name: Loxia canary gate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.base.ref == 'main'
    outputs:
      run_review: ${{ steps.check.outputs.run_review }}
    steps:
      # Shallow, single-branch checkout: this job only needs
      # execution/scripts/loxia_canary_gate.py and lib/daemon_runtime/, not
      # history — keep it cheap since it runs on every PR push, canary or not.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine whether this PR is in the swarm-canary lane
        id: check
        env:
          # Same label Apis/Anthus/Formica/neotoma-agent read from
          # ATELES_SWARM_REQUIRE_LABEL at runtime (lib/daemon_runtime/label_gate.py).
          # No repo variable exists for it yet (checked 2026-09-26); prefer one
          # (`vars.ATELES_SWARM_REQUIRE_LABEL`) if it's ever added so this can't
          # drift from the daemons' own configured value.
          CANARY_LABEL: ${{ vars.ATELES_SWARM_REQUIRE_LABEL || 'swarm-canary' }}
          EVENT_NAME: ${{ github.event_name }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run_review=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch is an explicit manual invocation — running unconditionally."
            exit 0
          fi
          python execution/scripts/loxia_canary_gate.py

  review:
    name: Loxia PR review
    needs: gate
    if: needs.gate.outputs.run_review == 'true'
    runs-on: ubuntu-latest

    # GITHUB_TOKEN scope: read the code, write the review comment back to the PR.
    # Without pull-requests: write the comment POST returns HTTP 403 Forbidden.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install httpx

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install subscription harness CLIs
        run: npm install -g @anthropic-ai/claude-code @openai/codex

      - name: Restore optional Codex subscription authentication
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          raw = os.environ.get("CODEX_AUTH_JSON", "").strip()
          if raw:
              auth = json.loads(raw)
              if auth.get("auth_mode") != "chatgpt" or auth.get("OPENAI_API_KEY"):
                  raise SystemExit("Codex review credentials must use ChatGPT subscription login")
              directory = Path.home() / ".codex"
              directory.mkdir(mode=0o700, exist_ok=True)
              target = directory / "auth.json"
              target.touch(mode=0o600, exist_ok=True)
              target.chmod(0o600)
              target.write_text(raw)
          PYTHON

      - name: Determine PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Loxia review
        env:
          # Empty/malformed qualification means unavailable capacity, never an
          # ambient model downgrade. No metered API credentials are passed.
          APIS_REVIEW_MODELS: ${{ vars.APIS_REVIEW_MODELS }}
          APIS_HARNESS_PROVIDERS: ${{ vars.APIS_HARNESS_PROVIDERS || 'claude,codex' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NEOTOMA_BEARER_TOKEN: ${{ secrets.NEOTOMA_BEARER_TOKEN }}
          NEOTOMA_BASE_URL: ${{ vars.NEOTOMA_BASE_URL || 'https://neotoma.markmhendrickson.com' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOXIA_PR_NUMBER: ${{ steps.pr.outputs.number }}
          LOXIA_REPO: ${{ github.repository }}
          LOXIA_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          LOXIA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python execution/scripts/loxia_review.py
