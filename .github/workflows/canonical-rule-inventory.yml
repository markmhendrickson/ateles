name: canonical rule inventory

# pull_request_target loads this workflow and all privileged executable code
# from the trusted default branch. Candidate repository files cross the hosted
# boundary only through the fixed data packer and its validated manifest.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - "docs/foundation/**"
      - "lib/daemon_runtime/agent_loader.py"
      - ".claude/skills/**/SKILL.md"
      - ".claude/hooks/*.py"
      - "execution/scripts/render_rule_inventory.py"
      - "execution/scripts/package_rule_inventory_inputs.py"
      - "execution/scripts/run_canonical_rule_inventory_gate.py"
      - "execution/scripts/test_canonical_rule_inventory_boundary.py"
      - "execution/scripts/test_rule_inventory_rulings.py"
      - ".github/workflows/canonical-rule-inventory.yml"
      - ".github/workflows/foundation-checks.yml"

permissions:
  contents: read

jobs:
  trusted-source:
    name: canonical measurement source is trusted
    runs-on: ubuntu-latest
    steps:
      - name: Refuse fork repositories before privileged execution
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::canonical measurement refuses code from fork repositories"
            exit 1
          fi

  candidate-inputs:
    name: package candidate inputs as data
    needs: trusted-source
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted measurement code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Check out declared candidate inputs
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Copy fixed candidate inputs into a data-only tree
        run: |
          python3 trusted/execution/scripts/package_rule_inventory_inputs.py \
            --source "$GITHUB_WORKSPACE/candidate" \
            --destination "$GITHUB_WORKSPACE/candidate-inputs"
      - name: Upload candidate input data
        uses: actions/upload-artifact@v4
        with:
          name: canonical-rule-inventory-inputs
          path: candidate-inputs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  rule-inventory:
    name: canonical rule inventory
    needs: candidate-inputs
    runs-on: [self-hosted, macOS, canonical-rule-inventory]
    timeout-minutes: 15
    steps:
      - name: Check out trusted measurement code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download candidate input data
        uses: actions/download-artifact@v4
        with:
          name: canonical-rule-inventory-inputs
          path: candidate-inputs
      - name: Validate candidate input boundary
        run: |
          python3 trusted/execution/scripts/package_rule_inventory_inputs.py \
            --validate "$GITHUB_WORKSPACE/candidate-inputs"

      # RULE_INVENTORY_CANONICAL_REPOSITORY_ROOTS is supplied by the runner
      # service environment. It is never copied into repository configuration
      # or printed. The wrapper captures all renderer output and emits only a
      # stable exit-class message.
      - name: Rule inventory — full measured output matches
        env:
          NEOTOMA_BEARER_TOKEN: ${{ secrets.NEOTOMA_BEARER_TOKEN }}
        run: |
          python3 trusted/execution/scripts/run_canonical_rule_inventory_gate.py \
            "$GITHUB_WORKSPACE/candidate-inputs"
