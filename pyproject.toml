[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ateles"
version = "0.0.0"
description = "Personal agent swarm infrastructure — attributed, capability-scoped, Neotoma-canonical."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["agents", "swarm", "neotoma", "aauth", "automation"]

# Core runtime dependencies shared by the daemon runtime (lib/daemon_runtime)
# and the CLI. Per-daemon and optional extras live in the groups below; folding
# the repo's scattered requirements.txt files into these groups is remaining W0
# work (a uv/pip-tools lockfile is the "pinned/locked" follow-up).
dependencies = [
    "httpx>=0.27",          # Neotoma HTTP + SSE client
    "apprise>=1.7",         # notification routing (lib/notify)
    "cryptography>=42.0.0", # EC P-256 AAuth signing
    "PyJWT>=2.8.0",         # AAuth token minting
]

[project.optional-dependencies]
# Apis A2A inbound gateway — folds execution/daemons/apis/requirements.txt.
a2a = ["a2a-sdk>=0.3.0", "uvicorn>=0.30.0"]
# Apis GitHub webhook gateway (execution/daemons/apis/github_gateway.py) —
# imports aiohttp unconditionally at module load, so it's needed to even
# collect execution/daemons/apis/test_github_gateway.py and
# test_swarm_dispatch.py (which imports github_gateway transitively).
apis-gateway = ["aiohttp>=3.9"]
# File-watching daemons — folds scripts/requirements.txt.
watch = ["watchdog>=3.0.0"]
# OPTIONAL local voice-activity detection for the streaming transcript path
# (execution/scripts/stream_transcript.py). Deliberately optional: the input
# gate degrades to its RMS threshold alone when this is absent, and announces
# the degradation on the operator-visible JSONL rather than only to stderr.
#
# Measured value, on the labelled corpus, is currently ZERO: webrtcvad changed
# no suppression outcome across 56 labelled chunks, and on the case it was
# added for (a fabricated chunk at -31.6 dBFS) it scores the fabrication as
# MORE speech-like (0.75) than genuine operator speech (0.42) at every
# aggressiveness level. Kept installable, and wired, so the finding stays
# reproducible — but nothing should depend on it until a detector that
# actually discriminates replaces it. See ateles#631.
#
# `webrtcvad-wheels`, not `webrtcvad`: the original 2.0.10 is unimportable on
# Python 3.12+. Its module does `import pkg_resources` purely to populate
# __version__, and setuptools no longer ships pkg_resources, so the import
# fails on a machine where pip reported a successful install. That is how this
# layer stayed dead after being "installed" — the failure is an ImportError,
# indistinguishable to `load_speech_detector` from never having installed it.
# The fork is the same C extension with that line removed.
vad = ["webrtcvad-wheels>=2.0.14"]
# Reference MCP servers under docs/mcp/* — union of their runtime deps so
# `pip install ateles[mcp-examples]` can run them. Each server still keeps its
# own requirements.txt for standalone use; removing those once this extra is
# validated is a follow-up. (httpx, used by the interviews server, is core.)
mcp-examples = [
    "mcp>=1.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "asana>=5.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
]
# Test + lint tooling for the package and the co-located test_*.py suite.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",
    "ruff>=0.5",
    "aiohttp>=3.9", # execution/daemons/apis test collection (see apis-gateway extra)
    # execution/scripts/transcribe_audio.py imports openai + dotenv unconditionally
    # at module load, so both are needed to collect test_transcribe_audio.py
    # (ateles#524, PR #527 round 2 — execution/scripts/ had no CI lane at all).
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ateles = "ateles.cli:main"

[project.urls]
Homepage = "https://github.com/markmhendrickson/ateles"
Issues = "https://github.com/markmhendrickson/ateles/issues"

[tool.hatch.build.targets.wheel]
packages = ["ateles"]
